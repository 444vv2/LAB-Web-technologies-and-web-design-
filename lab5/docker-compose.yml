services:
  postgres:
    image: postgres:16-alpine
    container_name: lab5-postgres
    restart: unless-stopped
    environment:
      # These defaults match python-service/.env
      POSTGRES_DB: ${DB_NAME:-card_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab5-backend
    restart: unless-stopped
    working_dir: /app/python-service
    env_file:
      - ./backend/python-service/.env
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/python-service:/app/python-service

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: lab5-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
